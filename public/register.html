<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Charge Up Savings</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">⚡</span>
            <span>Charge&nbsp;Up Savings</span>
        </a>
    </header>

    <main class="authwrap">
        <div class="authcard">
            <h1 class="h1">Create an account</h1>
            <p class="lead">Find the money you're already entitled to.</p>

            <div id="message"></div>

            <form id="register-form">
                <div class="field">
                    <label class="field-label" for="fullname">Full name</label>
                    <input type="text" id="fullname" placeholder="Jane Doe" required>
                </div>
                <div class="field">
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" placeholder="you@school.edu" required>
                </div>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" required>
                </div>
                <div class="field">
                    <label class="field-label" for="repeat">Repeat password</label>
                    <input type="password" id="repeat" placeholder="••••••••" required>
                </div>
                <label class="consent" for="store-data">
                    <input type="checkbox" id="store-data">
                    <span>
                        <strong>Save my profile and email me my top scholarship matches</strong>
                        <small>Stored in your account. You can change this any time on your account page. Turning it off deletes your saved data.</small>
                    </span>
                </label>
                <button type="submit" class="btn btn--gold">Register</button>
            </form>

            <p class="linkrow">Already registered? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script type="module" src="register.js"></script>
</body>
</html>
