<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Login Form</title>
</head>
<body>
    <div class="container">
        <div id="message"></div>

        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email" placeholder="Enter Email:" class="form-control" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Enter Password:" class="form-control" required>
            </div>
            <div class="form-btn">
                <input type="submit" value="Login" class="btn btn-primary">
            </div>
        </form>

        <div class="mt-3">
            <button id="google-btn" type="button" class="btn btn-outline-secondary w-100">Sign in with Google</button>
        </div>

        <div><p class="mt-3"><a href="#" id="forgot-link">Forgot your password?</a></p></div>
        <div><p>Not registered yet? <a href="register.html">Register Here</a></p></div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
