<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Charge Up Savings</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">⚡</span>
            <span>Charge&nbsp;Up Savings</span>
        </a>
    </header>

    <main class="authwrap">
        <div class="authcard">
            <h1 class="h1">Log in</h1>
            <p class="lead">Find the money you're already entitled to.</p>

            <div id="message"></div>

            <form id="login-form">
                <div class="field">
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" placeholder="you@school.edu" required>
                </div>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn--gold">Log in</button>
            </form>

            <div class="divider">or</div>

            <button id="google-btn" type="button" class="btn btn--ghost">Sign in with Google</button>

            <p class="linkrow"><a href="#" id="forgot-link">Forgot your password?</a></p>
            <p class="linkrow">Not registered yet? <a href="register.html">Register here</a></p>
        </div>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
